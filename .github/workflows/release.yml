name: Publish Windows installer
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/linux -v
  release:
    needs: linux-tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test core and Linux installer
        shell: pwsh
        run: |
          dotnet test tests/SptLinuxInstaller.Tests/SptLinuxInstaller.Tests.csproj --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/linux -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build portable Windows application
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Release tag must use vMAJOR.MINOR.PATCH.' }
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          dotnet publish src/SptLinuxInstaller.App/SptLinuxInstaller.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows -p:Version=$releaseVersion
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $previewPath = Join-Path $PWD 'artifacts/release-preview.png'
          $app = Start-Process artifacts/windows/SPT-Linux-Installer.exe -ArgumentList @('--render-preview', ('"' + $previewPath + '"')) -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(30000)) { throw 'Published application did not finish its startup check.' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path $previewPath)) { throw 'Published application failed its startup check.' }
          ./tools/Package-Portable.ps1
          $hash = (Get-FileHash artifacts/SPT-Linux-Installer-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SPT-Linux-Installer-Windows-x64.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "SPT Linux Installer $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag --draft
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload $env:GITHUB_REF_NAME artifacts/SPT-Linux-Installer-Windows-x64.zip artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
