name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/SptLinuxInstaller.Tests/SptLinuxInstaller.Tests.csproj --configuration Release
      - run: dotnet publish src/SptLinuxInstaller.App/SptLinuxInstaller.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows
      - name: Include licenses and documentation
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md artifacts/windows/
          Copy-Item licenses, docs artifacts/windows/ -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: SPT-Linux-Installer-Windows-x64
          path: artifacts/windows/
          retention-days: 14
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/linux -v
